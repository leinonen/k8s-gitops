# ArgoCD manages itself. Release name and values match the cloud-init install
# in leinonen/infrastructure stacks/k8s, so this adopts that release.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.10.5
    helm:
      releaseName: argocd
      valuesObject:
        dex:
          enabled: false
        notifications:
          enabled: false
        configs:
          params:
            server.insecure: true # TLS ends at Traefik
        server:
          ingress:
            enabled: true
            ingressClassName: traefik
            hostname: argocd.k8s.leinonen.ninja
            tls: true
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
