# CI renders this into k8s-gitops apps/factory-test/ with ghcr.io/leinonen/app-factory/factory-test:92c4c65f8d325d154152a885e760e87cd407952c set to the built image.
# Namespace factory-test is created by ArgoCD.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: factory-test
  template:
    metadata:
      labels:
        app: factory-test
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: factory-test
          image: ghcr.io/leinonen/app-factory/factory-test:92c4c65f8d325d154152a885e760e87cd407952c
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          # Keep serving while Traefik drops the pod from its endpoints.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: factory-test
spec:
  selector:
    app: factory-test
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: factory-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: factory-test.k8s.leinonen.ninja
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: factory-test
                port:
                  number: 80
  tls:
    - hosts:
        - factory-test.k8s.leinonen.ninja
      secretName: factory-test-tls
---
# Pull secret for the private GHCR package, shared by all factory apps.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr
spec:
  secretStoreRef: { kind: ClusterSecretStore, name: ssm }
  target:
    name: ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "leinonen:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef: { key: /k8s/shared/ghcr-token }
